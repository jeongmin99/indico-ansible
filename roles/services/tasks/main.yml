---
- name: Write uWSGI config
  ansible.builtin.template:
    src: uwsgi-indico.ini.j2
    dest: /etc/uwsgi-indico.ini
    mode: "0644"

- name: Write systemd units for uWSGI and Celery
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    mode: "0644"
  loop:
    - indico-uwsgi
    - indico-celery
  register: indico_units

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: indico_units.changed
