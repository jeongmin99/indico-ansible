---
- name: Install PostgreSQL
  ansible.builtin.yum:
    name:
      - "postgresql{{ pg_version }}"
      - "postgresql{{ pg_version }}-server"
      - "postgresql{{ pg_version }}-libs"
      - "postgresql{{ pg_version }}-devel"
      - "postgresql{{ pg_version }}-contrib"
    state: present

- name: Install build tools, Redis and nginx
  ansible.builtin.yum:
    name:
      - git
      - gcc
      - make
      - redis
      - nginx
    state: present

# pyenv로 Python을 빌드할 때 필요한 헤더
- name: Install libraries for building Python and Indico
  ansible.builtin.yum:
    name:
      - libjpeg-turbo-devel
      - libxslt-devel
      - libxml2-devel
      - libffi-devel
      - pcre-devel
      - libyaml-devel
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - openssl-devel
      - xz
      - xz-devel
      - findutils
      - libuuid-devel
      - tar
    state: present
