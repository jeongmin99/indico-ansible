---
# SELinux는 끄지 않고, Indico 설치 문서의 정책 모듈을 올린다.
- name: Copy SELinux policy module
  ansible.builtin.copy:
    src: indico.cil
    dest: /etc/selinux/indico.cil
    mode: "0644"
  register: indico_cil

- name: Load SELinux policy module
  ansible.builtin.command: semodule -i /etc/selinux/indico.cil
  when: indico_cil.changed
  changed_when: true
