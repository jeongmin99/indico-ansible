---
- name: Install EPEL repository
  ansible.builtin.yum:
    name: epel-release
    state: present

# 기본 저장소의 postgresql 9.2 패키지가 PGDG 13 패키지와 섞이지 않도록 막는다.
- name: Exclude postgresql from CentOS base and updates
  ansible.builtin.lineinfile:
    path: /etc/yum.repos.d/CentOS-Base.repo
    insertafter: "{{ item }}"
    line: "exclude=postgresql*"
    firstmatch: true
  loop:
    - '^\[base\]'
    - '^\[updates\]'

- name: Install Software Collections repository
  ansible.builtin.yum:
    name: centos-release-scl
    state: present

# EL7의 오래된 CA 묶음으로는 인증서 검증이 실패해서 검증을 끈다.
- name: Install PGDG repository
  ansible.builtin.yum:
    name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-7-x86_64/pgdg-redhat-repo-latest.noarch.rpm
    state: present
    validate_certs: false
