---
- name: Create indico user
  ansible.builtin.user:
    name: "{{ indico_user }}"
    group: "{{ indico_group }}"
    home: "{{ indico_home }}"
    shell: /bin/bash
    system: true
    create_home: true

- name: Install pyenv
  ansible.builtin.shell: curl -L https://github.com/pyenv/pyenv-installer/raw/master/bin/pyenv-installer | bash
  args:
    creates: "{{ indico_home }}/.pyenv/bin/pyenv"
  become: true
  become_user: "{{ indico_user }}"

- name: Build Python {{ python_version }} with pyenv
  ansible.builtin.command: "{{ indico_home }}/.pyenv/bin/pyenv install {{ python_version }}"
  args:
    creates: "{{ indico_home }}/.pyenv/versions/{{ python_version }}/bin/python"
  become: true
  become_user: "{{ indico_user }}"
  environment:
    PYENV_ROOT: "{{ indico_home }}/.pyenv"

- name: Set global Python version
  ansible.builtin.copy:
    content: "{{ python_version }}\n"
    dest: "{{ indico_home }}/.pyenv/version"
    owner: "{{ indico_user }}"
    group: "{{ indico_group }}"
    mode: "0644"

- name: Create virtualenv
  ansible.builtin.command: >-
    {{ indico_home }}/.pyenv/versions/{{ python_version }}/bin/python
    -m venv --upgrade-deps --prompt indico {{ indico_venv }}
  args:
    creates: "{{ indico_venv }}/bin/python"
  become: true
  become_user: "{{ indico_user }}"

# 나중에 indico 사용자로 로그인했을 때 바로 indico 명령을 쓸 수 있게 한다.
- name: Set up shell environment for indico user
  ansible.builtin.blockinfile:
    path: "{{ indico_home }}/.bashrc"
    create: true
    owner: "{{ indico_user }}"
    group: "{{ indico_group }}"
    mode: "0644"
    block: |
      export PATH="{{ indico_home }}/.pyenv/bin:{{ pg_bin }}:$PATH"
      eval "$(pyenv init --path)"
      eval "$(pyenv init -)"
      source {{ indico_venv }}/bin/activate

- name: Install wheel
  ansible.builtin.pip:
    name: wheel
    virtualenv: "{{ indico_venv }}"
  become: true
  become_user: "{{ indico_user }}"

# psycopg2 빌드에 pg_config가 필요해서 PATH에 PostgreSQL bin을 넣는다.
- name: Install uWSGI and Indico
  ansible.builtin.pip:
    name:
      - uwsgi
      - indico
    virtualenv: "{{ indico_venv }}"
  become: true
  become_user: "{{ indico_user }}"
  environment:
    PATH: "{{ indico_path }}"

# expect 모듈은 대상 서버 Python에 pexpect가 있어야 동작한다.
- name: Install pip for system Python
  ansible.builtin.yum:
    name: python-pip
    state: present

- name: Install pexpect for system Python
  ansible.builtin.pip:
    name: pexpect

# 응답 목록은 질문 하나당 [첫 출력, 다시 출력될 때] 순서로 맞춰 둔 값이다.
- name: Run indico setup wizard
  ansible.builtin.expect:
    command: /bin/bash -c "indico setup wizard | sed 's/\x1b\[0m//g'"
    creates: "{{ indico_home }}/etc/indico.conf"
    responses:
      Indico root path:
        - ""
        - "\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b{{ indico_url }}"
      PostgreSQL database URI:
        - ""
        - ""
      Redis URI \(cache\):
        - ""
        - "{{ indico_admin_email }}"
      Admin email:
        - ""
        - ""
      SMTP host:
        - ""
        - ""
      SMTP username:
        - ""
        - ""
      Default timezone:
        - ""
        - "y"
      Enable system notices\?:
        - "y"
        - "y"
    echo: true
    timeout: 10
  become: true
  become_user: "{{ indico_user }}"
  environment:
    PATH: "{{ indico_path }}"
    PROMPT_TOOLKIT_COLOR_DEPTH: DEPTH_1_BIT
