---
- name: Create nginx log directory
  ansible.builtin.file:
    path: "{{ indico_home }}/log/nginx"
    state: directory
    owner: "{{ indico_user }}"
    group: "{{ indico_group }}"
    mode: "0770"

# 설치 문서 권한 설정: 홈 아래 파일은 다른 사용자가 못 읽게 막고,
# nginx 그룹이 필요한 디렉터리만 연다.
- name: Remove group and other permissions under indico home
  ansible.builtin.shell: chmod go-rwx {{ indico_home }}/* {{ indico_home }}/.[^.]*
  changed_when: false

- name: Allow nginx group to traverse data directories
  ansible.builtin.file:
    path: "{{ indico_home }}/{{ item }}"
    mode: "0710"
  loop: ["", archive, cache, log, tmp]

- name: Allow nginx group to read web and venv
  ansible.builtin.file:
    path: "{{ indico_home }}/{{ item }}"
    mode: "0750"
  loop: [web, .venv]

- name: Allow nginx group to write its logs
  ansible.builtin.file:
    path: "{{ indico_home }}/log/nginx"
    mode: "g+w"

- name: Restore SELinux labels
  ansible.builtin.command: restorecon -R {{ indico_home }}/
  changed_when: false

- name: Serve static files through nginx
  ansible.builtin.lineinfile:
    path: "{{ indico_home }}/etc/indico.conf"
    line: "STATIC_FILE_METHOD = ('xaccelredirect', {'{{ indico_home }}':'/.xsf/indico'})"

- name: Check whether the database is already prepared
  ansible.builtin.command: psql indico -tAc "SELECT 1 FROM pg_namespace WHERE nspname='events'"
  become: true
  become_user: postgres
  register: indico_schema
  changed_when: false

- name: Create Indico tables
  ansible.builtin.command: "{{ indico_venv }}/bin/indico db prepare"
  become: true
  become_user: "{{ indico_user }}"
  environment:
    PATH: "{{ indico_path }}"
  when: indico_schema.stdout != "1"
  changed_when: true

- name: Restart and enable web services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    - nginx
    - indico-celery
    - indico-uwsgi
