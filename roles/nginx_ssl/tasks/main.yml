---
- name: Write nginx site config
  ansible.builtin.template:
    src: indico.conf.j2
    dest: /etc/nginx/conf.d/indico.conf
    mode: "0644"

- name: Create TLS directory
  ansible.builtin.file:
    path: /etc/ssl/indico
    state: directory
    owner: root
    group: root
    mode: "0700"

# RFC 7919 ffdhe2048 그룹 (Indico 설치 문서에서 쓰는 값)
- name: Copy DH parameters
  ansible.builtin.copy:
    src: ffdhe2048
    dest: /etc/ssl/indico/ffdhe2048
    mode: "0600"

- name: Create self-signed certificate
  ansible.builtin.command: >-
    openssl req -x509 -nodes -newkey rsa:4096
    -subj "/CN={{ indico_hostname }}"
    -keyout /etc/ssl/indico/indico.key
    -out /etc/ssl/indico/indico.crt
  args:
    creates: /etc/ssl/indico/indico.crt
